# CI de Azul Chat: los mismos controles que se corren a mano antes de empujar.
#
# Sin despliegue, sin publicar imágenes y sin credenciales. Los tests de base
# usan un PostgreSQL descartable del propio runner (service container); la
# contraseña de abajo es de ese contenedor efímero y no es un secreto.
# Ningún paso habla con el ERP: los tests usan un ERP de mentira local.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests sin base
        run: npm test

      - name: Tests contra PostgreSQL (migración desde base vacía incluida)
        run: npm run test:db
        env:
          AZUL_CHAT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build y verificación del bundle (secretos canario)
        run: npm run verificar:bundle

  # La imagen de producción se construye en cada PR, SIN publicarla: un
  # Dockerfile roto se ve acá y no recién al publicar desde main.
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: El compose de producción es válido (sin archivos de entorno)
        run: AZUL_CHAT_IMAGE=azul-chat:ci docker compose -f docker-compose.prod.yml config --quiet --no-env-resolution

      - name: Construir la imagen (sin publicar)
        run: docker build --build-arg APP_BUILD_ID="${{ github.sha }}" -t azul-chat:ci .

      - name: Verificar la imagen
        run: |
          set -euo pipefail
          USUARIO=$(docker image inspect azul-chat:ci --format '{{.Config.User}}')
          BUILD_ID=$(docker image inspect azul-chat:ci --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^APP_BUILD_ID=//p')
          [ "$USUARIO" = "node" ] || { echo "la imagen no corre como node: ${USUARIO}"; exit 1; }
          [ "$BUILD_ID" = "${{ github.sha }}" ] || { echo "APP_BUILD_ID=${BUILD_ID} no es el commit"; exit 1; }
          docker run --rm --entrypoint sh azul-chat:ci -c '
            set -e
            id -u | grep -qx 1000
            prisma --version >/dev/null
            test -f /app/server.js
            test -d /app/prisma/migrations
            # `set -e` no corta con `!`: estos dos van con if explícito.
            if find / -xdev \( -name ".env" -o -name ".env.*" -o -name "app.env" -o -name "db.env" \) -print 2>/dev/null | grep -q .; then
              echo "hay un archivo de entorno dentro de la imagen"; exit 1
            fi
            if touch /app/server.js 2>/dev/null; then
              echo "el código de la app es escribible por el proceso"; exit 1
            fi
          '
